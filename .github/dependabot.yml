version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 removed baseUrl, which @docusaurus/tsconfig 3.x still sets.
      # Remove this rule when upgrading to Docusaurus v4.
      - dependency-name: typescript
        versions: [">= 7"]
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - react
          - react-dom

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
